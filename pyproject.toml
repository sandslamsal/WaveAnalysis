[project]
name = "wavelabx"
version = "0.3.1"
description = "WaveLabX: A Python and web-based toolkit for wave statistics and incident-reflected decomposition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
  {name = "Sandesh Lamsal", email = "sandeshlamsal@miami.edu"},
  {name = "Claudia Deveaux Garrido"},
  {name = "Brian K. Haus"},
  {name = "Landolf Rhode-Barbarigos"},
]
keywords = [
  "wave reflection",
  "Goda-Suzuki",
  "wave flume",
  "coastal engineering",
  "physical modeling",
  "signal processing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
  "pandas>=1.3",
  "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sandslamsal/WaveLabX"
Repository = "https://github.com/sandslamsal/WaveLabX"
Demo = "https://wave-lab-x.vercel.app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"